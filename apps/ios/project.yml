name: Nima
options:
  bundleIdPrefix: so.nima.app
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

packages:
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk
    exactVersion: "18.1.1"
  Tenjin:
    url: https://github.com/tenjin/tenjin-ios-spm.git
    exactVersion: "1.20.1"
  Tun2SocksKit:
    # Keep exact pin aligned with UDP decoder framing assumptions.
    url: https://github.com/EbrahimTahernejad/Tun2SocksKit
    exactVersion: "5.14.4"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.0.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    exactVersion: "3.90.2"
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    exactVersion: "4.6.1"

targets:
  Nima:
    type: application
    platform: iOS
    sources:
      - path: Nima
        excludes:
          - Resources/PaintDrying
      - path: Nima/Resources/PaintDrying
        type: folder
        buildPhase: resources
      - path: Shared
    resources:
      - path: Nima/PrivacyInfo.xcprivacy
    dependencies:
      - package: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - package: Facebook
        product: FacebookCore
      - package: Tenjin
        product: TenjinSDK
      - sdk: AdServices.framework
        weak: true
      - sdk: AppTrackingTransparency.framework
      - sdk: AdSupport.framework
      - package: PostHog
        product: PostHog
      - package: Lottie
        product: Lottie
      - target: NimaTunnel
      - sdk: NetworkExtension.framework
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - target: NimaDeviceActivity
      - target: NimaShieldConfiguration
      - target: NimaShieldAction
    info:
      path: Nima/Info.plist
      properties:
        CFBundleDisplayName: Nima
        CFBundleName: Nima
        CFBundleShortVersionString: "1.4"
        CFBundleVersion: "31"
        UIAppFonts:
          - SK Pupok Solid 400.ttf
          - Coolvetica Rg.otf
          - Coolvetica Rg It.otf
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchStoryboardName: LaunchScreen
        UIBackgroundModes:
          - audio
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_KEY: $(SUPABASE_KEY)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - nima
        FacebookAppID: $(META_APP_ID)
        FacebookClientToken: $(META_CLIENT_TOKEN)
        FacebookDisplayName: Nima
        META_ADS_ENABLED: $(META_ADS_ENABLED)
        TENJIN_ENABLED: $(TENJIN_ENABLED)
        TENJIN_SDK_KEY: $(TENJIN_SDK_KEY)
        NSAdvertisingAttributionReportEndpoint: https://tenjin-skan.com
        FacebookAutoInitEnabled: false
        FacebookAutoLogAppEventsEnabled: false
        FacebookAdvertiserIDCollectionEnabled: false
        NSUserTrackingUsageDescription: Your permission helps us measure which Nima ads lead to downloads and subscriptions.
        NSCameraUsageDescription: Allow Instagram inside Nima to take photos and videos when you choose to create a post or message.
        NSMicrophoneUsageDescription: Allow Instagram inside Nima to record audio when you choose to create a post or message.
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        POSTHOG_PROJECT_TOKEN: phc_mynhT9RrN7pmWn8AdwRYJr5PEHXiVPKezg98mATbtSfi
        POSTHOG_HOST: https://eu.i.posthog.com
    entitlements:
      path: Nima/chungus.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.so.nima.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.nima.app
        INFOPLIST_FILE: Nima/Info.plist
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SSTZYP6ZWB
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  NimaTunnel:
    type: app-extension
    platform: iOS
    sources:
      - NimaTunnel
      - Shared/TimeWindowCore.swift
    dependencies:
      - package: Tun2SocksKit
      - sdk: NetworkExtension.framework
    info:
      path: NimaTunnel/Info.plist
      properties:
        CFBundleDisplayName: Nima Tunnel
        CFBundleShortVersionString: "1.4"
        CFBundleVersion: "31"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: NimaTunnel/chungusTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.so.nima.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.nima.app.NimaTunnel
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SSTZYP6ZWB
        TARGETED_DEVICE_FAMILY: 1

  NimaDeviceActivity:
    type: app-extension
    platform: iOS
    sources:
      - NimaDeviceActivity
      - Nima/NimaConstants.swift
      - Nima/Models/StreakStore.swift
      - Shared/AppControlRule.swift
      - Shared/TimeWindowCore.swift
      - Shared/ClientShieldPolicy.swift
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
    info:
      path: NimaDeviceActivity/Info.plist
      properties:
        CFBundleDisplayName: Nima Device Activity
        CFBundleShortVersionString: "1.4"
        CFBundleVersion: "31"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: NimaDeviceActivity/NimaDeviceActivity.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.so.nima.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.nima.app.DeviceActivityMonitor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SSTZYP6ZWB
        TARGETED_DEVICE_FAMILY: 1

  NimaShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - NimaShieldConfiguration
      - Shared/AppControlRule.swift
    resources:
      - path: Nima/Assets.xcassets/AppIcon.appiconset/AppIcon-1024x1024.png
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
    info:
      path: NimaShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: Nima Shield Configuration
        CFBundleShortVersionString: "1.4"
        CFBundleVersion: "31"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: NimaShieldConfiguration/NimaShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.so.nima.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.nima.app.ShieldConfiguration
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SSTZYP6ZWB
        TARGETED_DEVICE_FAMILY: 1

  NimaShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - NimaShieldAction
      - Shared/AppControlRule.swift
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
    info:
      path: NimaShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Nima Shield Action
        CFBundleShortVersionString: "1.4"
        CFBundleVersion: "31"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: NimaShieldAction/NimaShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.so.nima.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.nima.app.ShieldAction
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SSTZYP6ZWB
        TARGETED_DEVICE_FAMILY: 1

  NimaTunnelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NimaTunnelTests
      - path: NimaTunnel/NimaConstants.swift
      - path: NimaTunnel/ReelsBlockFilter.swift
      - path: NimaTunnel/SOCKSProxyServer.swift
      - path: NimaTunnel/TrafficStats.swift
      - path: NimaTunnel/TunnelLogger.swift
      - path: NimaTunnel/UDPControlStreamDecoder.swift
      - path: Shared/TimeWindowCore.swift
    dependencies:
      - package: Tun2SocksKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.nima.app.NimaTunnelTests
        DEVELOPMENT_TEAM: SSTZYP6ZWB
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

  NimaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NimaTests
    dependencies:
      - target: Nima
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.nima.app.NimaTests
        DEVELOPMENT_TEAM: SSTZYP6ZWB
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nima.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Nima"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

  NimaStoreKitHarness:
    type: application
    platform: iOS
    sources:
      - path: NimaStoreKitHarness
    dependencies:
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.nima.app.storekit-harness
        DEVELOPMENT_TEAM: SSTZYP6ZWB
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES

  TikTokVPNDropUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TikTokVPNDropUITests
    dependencies:
      - target: Nima
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.nima.app.TikTokVPNDropUITests
        DEVELOPMENT_TEAM: SSTZYP6ZWB
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Nima

schemes:
  Nima:
    build:
      targets:
        Nima: all
        NimaTunnel: all
        NimaTests: [test]
        NimaTunnelTests: [test]
    test:
      targets:
        - NimaTests
        - NimaTunnelTests

  TikTokVPNDropUITests:
    build:
      targets:
        Nima: all
        TikTokVPNDropUITests: [test]
    test:
      targets:
        - TikTokVPNDropUITests

  NimaStoreKitHarness:
    build:
      targets:
        NimaStoreKitHarness: all
    run:
      config: Debug
      debugEnabled: false
      storeKitConfiguration: NimaStoreKitTests/NimaSubscriptions.storekit

  NimaTunnel:
    build:
      targets:
        Nima: all
        NimaTunnel: all
        NimaTunnelTests: [test]
    test:
      targets:
        - NimaTunnelTests
